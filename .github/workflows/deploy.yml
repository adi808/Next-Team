name: Deploy to Cloudflare Pages

on:
  push:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  # Public values: the publishable key is meant to ship in the browser bundle; RLS protects the data.
  VITE_SUPABASE_URL: https://sfraexchddrbucsxpejz.supabase.co
  VITE_SUPABASE_ANON_KEY: sb_publishable_G8nzNgn_GFZgXc8dS8cjRg_tmD4Y_BJ
  PAGES_PROJECT: next-team

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

      # Needs repository secrets CLOUDFLARE_API_TOKEN (Cloudflare Pages: Edit) and CLOUDFLARE_ACCOUNT_ID.
      # Without them the build still runs and the deploy is skipped.
      - name: Check Cloudflare secrets
        id: cf
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ]; then echo "::warning::CLOUDFLARE_API_TOKEN is not set; skipping deploy"; exit 0; fi
          # Accept a pasted dashboard URL or stray whitespace: keep only the 32-hex account id.
          id=$(printf '%s' "$ACCOUNT" | tr 'A-F' 'a-f' | grep -oE '[0-9a-f]{32}' | head -n1 || true)
          if [ -z "$id" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID must contain the 32-character account id (dash.cloudflare.com/<id>/...)"; exit 1
          fi
          echo "::add-mask::$id"
          echo "CLOUDFLARE_ACCOUNT_ID=$id" >> "$GITHUB_ENV"
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Create Pages project if missing
        if: steps.cf.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx --yes wrangler@3.114.0 pages project list | grep -qw "$PAGES_PROJECT" \
            || npx --yes wrangler@3.114.0 pages project create "$PAGES_PROJECT" \
                 --production-branch "${{ github.event.repository.default_branch }}"
      # The default branch deploys to production; other branches get preview URLs.
      - name: Deploy
        if: steps.cf.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@3.114.0 pages deploy dist --project-name "$PAGES_PROJECT" --branch "${{ github.ref_name }}"
